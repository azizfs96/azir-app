# ============================================================================
# azir.sa — the customer web app (Flutter Web build of the same app)
# A customer who doesn't install the app opens azir.sa/s/<token> and orders.
# Serves flutter/build/web as a single-page app. Adjust deploy path + SSL.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name azir.sa www.azir.sa;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://azir.sa$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.azir.sa;

    ssl_certificate     /etc/letsencrypt/live/azir.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azir.sa/privkey.pem;

    return 301 https://azir.sa$request_uri;   # canonical host
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azir.sa;

    root /var/www/azir/web;             # flutter/build/web copied here
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/azir.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azir.sa/privkey.pem;

    charset utf-8;
    add_header X-Content-Type-Options nosniff;

    # Hashed Flutter assets cache hard; the app shell must not.
    location ~* \.(?:js|css|wasm|woff2?|png|jpg|svg|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location = /index.html      { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }

    # SPA fallback: /s/<token>, /orders/<id>, etc. all return index.html so the
    # in-app router handles deep links (and a page refresh doesn't 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/azir.sa.access.log;
    error_log  /var/log/nginx/azir.sa.error.log;
}
