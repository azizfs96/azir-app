# ============================================================================
# api.azir.sa — the Laravel API (Azir backend)
# Document root is Back-end/public. Adjust the deploy path and PHP-FPM socket
# to match the server. SSL is managed by certbot (see DEPLOY.md).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.azir.sa;

    # Let certbot answer the ACME challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.azir.sa;

    root /var/www/azir/api/public;
    index index.php;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/api.azir.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.azir.sa/privkey.pem;

    client_max_body_size 12M;           # menu/banner image uploads
    charset utf-8;

    # Security headers.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match the installed PHP-FPM
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Long-cache the uploaded files (menu images, banner, logo, QR).
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\.(?!well-known).* { deny all; }
    access_log /var/log/nginx/api.azir.sa.access.log;
    error_log  /var/log/nginx/api.azir.sa.error.log;
}
