# ============================================================================
# portal.azir.sa — the merchant dashboard (Vite static build)
# Serves frond-end/dist as a single-page app. Adjust the deploy path and SSL.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name portal.azir.sa;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.azir.sa;

    root /var/www/azir/portal;          # frond-end/dist copied here
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/portal.azir.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.azir.sa/privkey.pem;

    charset utf-8;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Hashed asset files can be cached hard; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every route returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/portal.azir.sa.access.log;
    error_log  /var/log/nginx/portal.azir.sa.error.log;
}
