<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>easy app — للتجار</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff;font-family:IBM Plex Sans Arabic,Bricolage Grotesque,sans-serif}.container{max-width:1160px;margin:0 auto;padding:0 20px}</style></head><body><!-- ======= MERCHANT CLIP: QR reach → ready in 5 min → integrations ======= -->
<section class="mz-section" id="mzSection" data-lang="ar">
<style>
.mz-section{padding:48px 0 64px;background:#fff;font-family:'IBM Plex Sans Arabic','Bricolage Grotesque',sans-serif}
.mz-section .mz-head{text-align:center;margin:0 auto 26px;max-width:760px}
.mz-logo-row{max-width:1100px;margin:0 auto;position:relative}
.mz-aud{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;background:#f3f3f3;border:1.5px solid #e4e4e4;border-radius:999px;padding:3px;direction:ltr;z-index:2}
.mz-aud a{display:inline-block;padding:8px 18px;border-radius:999px;font:600 13.5px/1 'IBM Plex Sans Arabic','Bricolage Grotesque',sans-serif;color:#555;text-decoration:none;transition:.2s;white-space:nowrap}
.mz-aud a.on{background:#0a0a0b;color:#fff}
.mz-aud a:not(.on):hover{color:#0a0a0b}
@media (max-width:720px){.mz-aud{position:static;transform:none;margin:14px auto 0;display:flex;width:max-content}.mz-logo-row{display:flex;flex-direction:column;align-items:stretch}}
.mz-logo{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin:0 0 22px;direction:ltr}
.mz-section[data-lang="ar"] .mz-logo{justify-content:flex-start;flex-direction:row-reverse}
.mz-logo img{width:48px;height:auto;display:block}
.mz-logo span{font:600 22px/1 'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif;color:#0f0f1a;letter-spacing:-.5px}
.mz-logo em{font:600 13px/1 'IBM Plex Sans Arabic',sans-serif;font-style:normal;padding:7px 12px;border-radius:999px;background:#0f0f1a;color:#fff}
.mz-section .mz-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:600;color:#0f0f1a;margin:0 0 10px;line-height:1.25}
.mz-section .mz-head p{font-size:16px;color:#6b6b7b;margin:0;line-height:1.7}
.mz-section[data-lang="en"] .mz-head{font-family:'Bricolage Grotesque',sans-serif}
.mz-section[data-lang="en"] .mz-head h2{letter-spacing:-.8px}
.mz-wrap{position:relative;width:100%;max-width:1100px;margin:0 auto;overflow:hidden;border-radius:28px;background:#050506;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.mz{position:absolute;top:0;left:0;width:1100px;height:680px;transform-origin:0 0;background:#050506;color:#fff;overflow:hidden;--brand:#fff;font-family:'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif}
.mz.mz-portrait{width:560px;height:1000px}
.mz-glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#fff 0%,transparent 60%);opacity:.07;top:-200px;right:-240px;filter:blur(30px);transition:background 1s}
.mz-portrait .mz-glow{top:auto;bottom:-300px;right:50%;margin-right:-450px}
.mz-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 70% 55%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 55%,#000 10%,transparent 70%)}
/* language pill */
.mz-lang{position:absolute;top:22px;right:28px;z-index:9;display:flex;gap:2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.mz-lang button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.65);font:600 12px/1 'IBM Plex Sans Arabic','Bricolage Grotesque',sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.mz-lang button.on{background:#fff;color:#111}
.mz-ar .mz-lang{right:auto;left:28px}
.mz-portrait .mz-lang{top:16px;right:16px}.mz-ar.mz-portrait .mz-lang{right:auto;left:16px}
/* copy */
.mz-copy{box-sizing:border-box;position:absolute;left:72px;top:0;height:100%;width:400px;display:flex;flex-direction:column;justify-content:center;gap:18px;z-index:5}
.mz-portrait .mz-copy{left:0;top:44px;width:100%;height:auto;align-items:center;text-align:center;padding:0 32px}
.mz-brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.mz-brand img{width:34px;height:34px;border-radius:9px}
.mz-brand span{font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
.mz-lines{position:relative;height:190px;width:100%}
.mz-portrait .mz-lines{height:170px}
.mz-line{position:absolute;inset:0;opacity:0;transform:translateY(12px);transition:opacity .22s,transform .22s}
.mz-line.on{opacity:1;transform:none;transition-duration:.5s;transition-delay:.1s}
.mz-line h3{font-size:44px;line-height:1.1;font-weight:600;letter-spacing:-1.4px;margin:0 0 12px;color:rgba(255,255,255,.55)}
.mz-line h3 b{font-weight:600;color:#fff}
.mz-line p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.7);margin:0}
.mz-ar .mz-line h3,.mz-ar .mz-line p,.mz-ar .mz-feat,.mz-ar .mz-brand{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
.mz-ar .mz-line h3{font-size:40px;line-height:1.3}
.mz-portrait .mz-line h3{font-size:32px}.mz-ar.mz-portrait .mz-line h3{font-size:30px}
.mz-portrait .mz-line p{font-size:15px}
.mz-dots{display:flex;gap:8px}
.mz-dot{height:5px;width:44px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.mz-dot i{position:absolute;inset:0;background:var(--brand);transform:scaleX(0);transform-origin:left}
.mz-ar .mz-dot i{transform-origin:right}
.mz-dot.done i{transform:scaleX(1)}
.mz-dot.run i{animation:mzFill var(--d,6s) linear forwards}
@keyframes mzFill{to{transform:scaleX(1)}}
.mz-feats{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mz-portrait .mz-feats{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 18px}
.mz-feat{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.82)}
.mz-feat i{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex:none}
.mz-feat i svg{width:14px;height:14px}
.mz-ar{direction:rtl}
.mz-ar .mz-copy{left:auto;right:72px;text-align:right}
.mz-ar.mz-portrait .mz-copy{right:0;text-align:center}
.mz-ar .mz-glow{right:auto;left:-240px}
.mz-ar .mz-grid{mask-image:radial-gradient(circle at 30% 55%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 30% 55%,#000 10%,transparent 70%)}
/* ---- 3D scene ---- */
.mz-scene{position:absolute;right:0;top:0;width:580px;height:680px;perspective:1600px;perspective-origin:50% 45%;z-index:2;direction:ltr}
.mz-ar .mz-scene{right:auto;left:0}
.mz-portrait .mz-scene,.mz-ar.mz-portrait .mz-scene{left:50%;right:auto;top:auto;bottom:0;width:560px;height:600px;margin-left:-280px}
.mz-float{position:absolute;inset:0;transform-style:preserve-3d}
@keyframes mzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mz-tab{position:absolute;left:90px;top:230px;width:400px;height:290px;transform-style:preserve-3d;transform:rotateY(-16deg) rotateX(8deg) rotateZ(-1deg);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.mz-ar .mz-tab{transform:rotateY(16deg) rotateX(8deg) rotateZ(1deg)}
.mz-portrait .mz-tab{left:80px;top:230px}
.mz-s-setup .mz-tab{transform:rotateY(-8deg) rotateX(5deg)}.mz-ar.mz-s-setup .mz-tab{transform:rotateY(8deg) rotateX(5deg)}
.mz-tab .back{position:absolute;inset:0;border-radius:22px;background:#101013;transform:translateZ(-12px);box-shadow:0 60px 90px rgba(0,0,0,.7)}
.mz-tab .side{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,#4a4a50,#1b1b1f 35%,#2d2d33 70%,#55555c)}
.mz-tab .side.s1{transform:translateZ(-10px)}.mz-tab .side.s2{transform:translateZ(-7px)}.mz-tab .side.s3{transform:translateZ(-4px)}
.mz-tab .body{position:absolute;inset:0;border-radius:22px;background:linear-gradient(150deg,#2a2a2e,#0b0b0d 45%,#1c1c20);padding:9px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),inset 0 0 0 4px #050506}
.mz-screen{position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;background:#F6F4F1;color:#1F1A16;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:11px;direction:rtl}
.mz-glare{position:absolute;inset:0;pointer-events:none;z-index:50;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 46%,rgba(255,255,255,.04) 52%,transparent 60%);transform:translateX(-120%);animation:mzGlare 8s ease-in-out infinite}
@keyframes mzGlare{0%,20%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.mz-view{position:absolute;inset:0;transition:opacity .4s}
.mz-view.hide{opacity:0;pointer-events:none}
/* dashboard */
.dz-top{height:34px;background:#fff;border-bottom:1px solid #ECE6DF;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;font-weight:600}
.dz-top .st{display:inline-flex;align-items:center;gap:6px}
.dz-top .st i{width:18px;height:18px;border-radius:6px;background:#1F1A16;display:inline-block}
.dz-top .bell{position:relative;width:24px;height:24px;border-radius:8px;background:#F1EDE8;display:flex;align-items:center;justify-content:center;color:#7A7068}
.dz-top .bell svg{width:12px;height:12px}
.dz-top .bell em{position:absolute;top:-6px;inset-inline-end:-6px;min-width:16px;height:16px;border-radius:8px;background:#D8412F;color:#fff;font-size:9px;font-style:normal;font-weight:600;line-height:16px;text-align:center;padding:0 4px;transition:transform .25s}
.dz-top .bell em.bump{transform:scale(1.35)}
.dz-stats{display:flex;gap:6px;padding:8px 10px 0}
.dz-stat{flex:1;background:#fff;border:1px solid #ECE6DF;border-radius:10px;padding:6px 8px}
.dz-stat small{display:block;font-size:8.5px;color:#7A7068}
.dz-stat b{display:block;font-size:14px;font-weight:600;margin-top:1px;direction:ltr;text-align:start;transition:transform .2s}
.dz-stat b.ok{color:#1F1A16}
.dz-sec{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 5px;font-size:10px;font-weight:600}
.dz-sec span{font-size:8.5px;color:#1F1A16;display:inline-flex;align-items:center;gap:5px;font-weight:600}
.dz-sec span:before{content:'';width:5px;height:5px;border-radius:50%;background:#1F1A16;animation:mzDot 1.4s ease-in-out infinite}
@keyframes mzDot{50%{opacity:.3}}
.dz-list{padding:0 10px;display:flex;flex-direction:column;gap:5px;overflow:hidden;height:150px}
.dz-row{background:#fff;border:1px solid #ECE6DF;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:8px;font-size:9.5px;animation:mzRow .45s cubic-bezier(.2,.8,.2,1)}
@keyframes mzRow{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.dz-row .tag{font-size:8px;font-weight:600;color:#fff;background:#1F1A16;padding:2px 7px;border-radius:999px;white-space:nowrap}
.dz-row .t{flex:1;min-width:0}
.dz-row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-row .t small{color:#7A7068;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dz-row .amt{font-weight:600;direction:ltr;white-space:nowrap}
.dz-row .ok{background:#1F1A16;color:#fff;font-size:8.5px;padding:4px 8px;border-radius:999px;white-space:nowrap}
/* setup wizard */
.wz{padding:12px 14px}
.wz .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wz .h b{font-size:12.5px;font-weight:600}
.wz .timer{font:600 12px/1 'Bricolage Grotesque',sans-serif;background:#1F1A16;color:#fff;padding:6px 10px;border-radius:999px;direction:ltr;display:inline-flex;align-items:center;gap:6px}
.wz .timer i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:mzDot 1s infinite}
.wz .bar{height:6px;border-radius:6px;background:#ECE6DF;overflow:hidden;margin-bottom:10px}
.wz .bar i{display:block;height:100%;width:0;background:#1F1A16;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wz-it{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ECE6DF;border-radius:10px;padding:6px 9px;margin-bottom:5px;font-size:10px;color:#7A7068;transition:.3s}
.wz-it .c{width:16px;height:16px;border-radius:50%;border:1.5px solid #D9D2CA;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:.3s}
.wz-it .c svg{width:9px;height:9px;opacity:0}
.wz-it.on{color:#1F1A16;border-color:#D9E9DF}
.wz-it.on .c{background:#1F1A16;border-color:#1F1A16}.wz-it.on .c svg{opacity:1}
.wz-it b{font-weight:600}.wz-it small{margin-inline-start:auto;font-size:8.5px;color:#ABA29A}
.wz .ready{position:absolute;left:14px;right:14px;bottom:12px;background:#1F1A16;color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;transform:translateY(80px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.wz .ready.on{transform:none}
.wz .ready i{width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.wz .ready i svg{width:11px;height:11px}
/* scene A: QR tent + customer phones */
.mz-tent{position:absolute;left:380px;top:40px;width:132px;border-radius:12px;background:#fff;color:#1F1A16;overflow:hidden;box-shadow:0 30px 50px rgba(0,0,0,.6);text-align:center;transform:rotateY(-14deg) translateZ(40px);visibility:visible;transition:opacity .4s,transform .8s,visibility 0s;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif}
.mz-ar .mz-tent{left:60px;transform:rotateY(14deg) translateZ(40px)}
.mz-portrait .mz-tent,.mz-ar.mz-portrait .mz-tent{left:214px;top:0;transform:translateZ(40px)}
.mz-tent .hd{height:28px;background:#1F1A16;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.mz-tent .hd i{width:14px;height:14px;border-radius:4px;background:#fff;display:inline-block}
.mz-tent svg.qr{width:84px;height:84px;display:block;margin:10px auto 4px}
.mz-tent small{display:block;font-size:8px;color:#7A7068;padding-bottom:8px}
.mz-tent .ring{position:absolute;inset:-6px;border-radius:16px;border:2px solid var(--brand);opacity:0}
.mz-tent.hit .ring{animation:mzRing .9s ease-out}
@keyframes mzRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.mz-ph{position:absolute;width:92px;height:190px;transform-style:preserve-3d;visibility:visible;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s;transform:translate3d(var(--x),var(--y),var(--z)) rotateY(var(--ry)) rotateX(4deg);z-index:3}
.mz-ph .pb{position:absolute;inset:0;border-radius:24px;background:#101013;transform:translateZ(-8px);box-shadow:0 30px 50px rgba(0,0,0,.65)}
.mz-ph .ps{position:absolute;inset:0;border-radius:24px;background:linear-gradient(160deg,#4a4a50,#1b1b1f 35%,#2d2d33 70%,#55555c)}
.mz-ph .ps.s1{transform:translateZ(-6px)}.mz-ph .ps.s2{transform:translateZ(-3px)}
.mz-ph .pbody{position:absolute;inset:0;border-radius:24px;background:linear-gradient(150deg,#2a2a2e,#0b0b0d 45%,#1c1c20);padding:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 2.5px #050506}
.mz-ph .pscr{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:#0a0a0b}
.mz-ph .pnotch{position:absolute;top:5px;left:50%;width:30px;height:9px;margin-left:-15px;border-radius:6px;background:#000;z-index:5}
.mz-ph .cam{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 35%,#2b2a28,#121211 70%)}
.mz-ph .ttl{position:absolute;top:20px;left:0;right:0;text-align:center;font:600 7px/1 'IBM Plex Sans Arabic',sans-serif;color:#fff}
.mz-ph .prev{position:absolute;left:50%;top:50%;width:50px;margin:-34px 0 0 -25px;border-radius:5px;background:#fff;padding:3px;opacity:0;transform:scale(.55);transition:opacity .35s,transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 16px rgba(0,0,0,.5)}
.mz-ph .prev .h{height:7px;border-radius:2px;background:#1F1A16;margin-bottom:3px}
.mz-ph .prev svg{width:44px;height:44px;display:block}
.mz-ph.scan .prev,.mz-ph.done .prev{opacity:1;transform:scale(1)}
.mz-ph .frm{position:absolute;left:12px;right:12px;top:46px;height:86px}
.mz-ph .frm b{position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.9);transition:border-color .3s,transform .3s}
.mz-ph .frm b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.mz-ph .frm b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.mz-ph .frm b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 4px}
.mz-ph .frm b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 4px 0}
.mz-ph.done .frm b{transform:scale(.8)}
.mz-ph .lz{position:absolute;left:14px;right:14px;top:50px;height:1.5px;background:#fff;box-shadow:0 0 8px #fff;opacity:0}
.mz-ph.scan .lz{opacity:1;animation:mzLz 1s ease-in-out infinite}
@keyframes mzLz{50%{top:126px}}
.mz-ph .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:4}
.mz-ph.done .flash{animation:mzFlash .55s ease-out}
@keyframes mzFlash{0%{opacity:.85}100%{opacity:0}}
.mz-ph .ok{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.4,1);z-index:3;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mz-ph .ok svg{width:14px;height:14px}
.mz-ph.done .ok{transform:scale(1)}.mz-ph.done .lz{animation:none;opacity:0}
.mz-ph .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:500 6.5px/1.3 'IBM Plex Sans Arabic',sans-serif;color:rgba(255,255,255,.6)}
.mz-ph .gl{position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.1) 48%,transparent 56%)}
.mz-ph.scan,.mz-ph.done{transform:translate3d(var(--sx),var(--sy),90px) rotateY(0) rotateX(0) scale(1.12)}
.mz-chip{position:absolute;left:0;top:0;padding:6px 10px;border-radius:999px;background:#fff;color:#1F1A16;font:600 10px/1 'IBM Plex Sans Arabic',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;z-index:6;direction:rtl;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mz-chip i{width:8px;height:8px;border-radius:50%;background:#1F1A16}
.mz-chip.fly{animation:mzChip .8s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes mzChip{0%{opacity:0;transform:translate(var(--ax),var(--ay)) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(.5)}}
/* scene B: store page preview card */
.mz-prev{position:absolute;left:430px;top:400px;width:120px;height:240px;border-radius:22px;background:#1a1a1c;padding:5px;box-shadow:0 0 0 1.5px #2c2c30,0 40px 60px rgba(0,0,0,.6);transform:translateY(60px) rotateY(-12deg);opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;z-index:4}
.mz-ar .mz-prev{left:30px;transform:translateY(60px) rotateY(12deg)}
.mz-portrait .mz-prev,.mz-ar.mz-portrait .mz-prev{left:420px;top:300px}
.mz-prev{visibility:hidden;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s .4s}
.mz-prev.on{opacity:1;visibility:visible;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s;transform:translateY(0) rotateY(-12deg)}.mz-ar .mz-prev.on{transform:translateY(0) rotateY(12deg)}
.mz-prev .s{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#F6F4F1;color:#1F1A16;font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;font-size:7px}
.mz-prev .cv{height:70px;background:#1F1A16;position:relative;display:flex;align-items:center;justify-content:center}
.mz-prev .cv i{width:26px;height:26px;border-radius:8px;background:#fff;display:block}
.mz-prev .nm{font-size:9px;font-weight:600;text-align:center;margin:6px 0 2px}
.mz-prev .md{display:flex;gap:3px;padding:0 6px 6px}
.mz-prev .md i{flex:1;height:12px;border-radius:5px;background:#fff;border:1px solid #ECE6DF}
.mz-prev .md i:first-child{background:#1F1A16;border-color:#1F1A16}
.mz-prev .it{display:flex;gap:4px;padding:0 6px 4px}
.mz-prev .it i{flex:1;aspect-ratio:1;border-radius:6px;background:#E9DCCB}
.mz-prev .tag{position:absolute;top:-10px;inset-inline-end:-6px;background:#fff;color:#111 !important;color:#fff;font-size:8px;font-weight:600;padding:3px 7px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
/* scene C: integration nodes + wires */
.mz-node{position:absolute;width:150px;height:54px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px;padding:0 10px;backdrop-filter:blur(6px);transition:.35s;opacity:0;transform:scale(.9);z-index:3;direction:rtl}
.mz-s-int .mz-node{opacity:1;transform:none}
.mz-node i{width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:#111;flex:none;transition:.35s}
.mz-node i svg{width:15px;height:15px}
.mz-node b{display:block;font-size:11px;font-weight:600;line-height:1.2;font-family:'IBM Plex Sans Arabic',sans-serif}
.mz-node small{display:block;font-size:9px;color:rgba(255,255,255,.55);margin-top:1px;font-family:'IBM Plex Sans Arabic',sans-serif}
.mz-node.live{background:#fff;color:#111;border-color:#fff;transform:scale(1.06) translateZ(30px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.mz-node.live i{background:#111;color:#fff}
.mz-node.live small{color:#555}
svg.mz-wires{display:none}
svg.mz-wires path{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.5}
svg.mz-wires path.flow{stroke:var(--c,#00BC6D);stroke-width:2;stroke-dasharray:6 10;animation:mzFlow .9s linear infinite;filter:drop-shadow(0 0 6px var(--c,#00BC6D))}
@keyframes mzFlow{to{stroke-dashoffset:-32}}
.mz-s-int .mz-tent,.mz-s-int .mz-ph,.mz-s-setup .mz-tent,.mz-s-setup .mz-ph{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s,visibility 0s .4s,transform .9s}
@media (prefers-reduced-motion:reduce){.mz-float,.mz-glare,.mz-ph .lz,svg.mz-wires path{animation:none}}

  },en:{

    forMerchants:'for merchants',

  }};
  var S=STRS[LANG];
  // phones (customers) and nodes are created once; strings re-applied on language change
  var qrMini=$('mzTent').querySelector('svg.qr').outerHTML;
  var PH=[0,1,2].map(function(i){var d=document.createElement('div');d.className='mz-ph';d.innerHTML='<div class="pb"></div><div class="ps s1"></div><div class="ps s2"></div><div class="pbody"><div class="pscr"><div class="pnotch"></div><div class="cam"><div class="ttl"></div><div class="prev"><div class="h"></div>'+qrMini+'</div><div class="frm"><b></b><b></b><b></b><b></b></div><div class="lz"></div><div class="flash"></div><div class="ok">'+I.check.replace('stroke="#fff"','stroke="#111"')+'</div><div class="hint"></div></div><div class="gl"></div></div></div>';$('mzPhones').appendChild(d);return d});
  var ND=[0,1,2,3,4].map(function(i){var d=document.createElement('div');d.className='mz-node';d.innerHTML='<i></i><div><b></b><small></small></div>';$('mzNodes').appendChild(d);return d});

  var portrait=false,scale=1;
  function layout(){
    var w=wrap.clientWidth;portrait=w<760;stage.classList.toggle('mz-portrait',portrait);
    var W=portrait?560:1100,H=portrait?1000:680;scale=w/W;
    stage.style.transform='scale('+scale+')';wrap.style.height=(H*scale)+'px';
    // customer phones: resting spots + scan spot (in front of the tent)
    var tentX=portrait?214:(AR?60:380),tentY=portrait?0:40;
    var rest=portrait?[[20,60,0],[470,90,-20],[20,440,10]]:(AR?[[470,60,0],[480,500,-20],[20,500,10]]:[[20,60,0],[10,500,-20],[500,500,10]]);
    var sx=portrait?tentX+138:(AR?tentX+140:tentX-112),sy=tentY+(portrait?6:16);
    PH.forEach(function(p,i){p.style.setProperty('--x',rest[i][0]+'px');p.style.setProperty('--y',rest[i][1]+'px');p.style.setProperty('--z',rest[i][2]+'px');p.style.setProperty('--ry',(rest[i][0]<280?18:-18)+'deg');p.style.setProperty('--sx',sx+'px');p.style.setProperty('--sy',sy+'px')});
    // chip path: tent → tablet list
    var chip=$('mzChip');chip.style.setProperty('--ax',(tentX+20)+'px');chip.style.setProperty('--ay',(tentY+90)+'px');chip.style.setProperty('--bx',(portrait?250:270)+'px');chip.style.setProperty('--by',(portrait?330:340)+'px');
    // integration nodes + wires
    var P=portrait?[[10,40],[400,40],[10,520],[400,520],[205,560]]:(AR?[[420,80],[420,560],[0,60],[0,580],[205,610]]:[[0,80],[0,560],[420,60],[420,580],[205,610]]);
    var tx=portrait?80:90,ty=230,tw=400,th=290,d='';
    ND.forEach(function(n,i){var p=P[i];n.style.left=p[0]+'px';n.style.top=p[1]+'px';
      var cx=p[0]+75,cy=p[1]+27,ex,ey,path;
      if(cy<ty){ex=Math.max(tx+50,Math.min(tx+tw-50,cx));ey=ty;path='M'+cx+' '+(cy+27)+' C '+cx+' '+(cy+90)+', '+ex+' '+(ey-70)+', '+ex+' '+ey}
      else if(cy>ty+th){ex=Math.max(tx+50,Math.min(tx+tw-50,cx));ey=ty+th;path='M'+cx+' '+(cy-27)+' C '+cx+' '+(cy-80)+', '+ex+' '+(ey+60)+', '+ex+' '+ey}
      else if(cx<tx+tw/2){ex=tx;ey=cy;path='M'+(cx+75)+' '+cy+' C '+(cx+120)+' '+cy+', '+(ex-40)+' '+ey+', '+ex+' '+ey}
      else{ex=tx+tw;ey=cy;path='M'+(cx-75)+' '+cy+' C '+(cx-120)+' '+cy+', '+(ex+40)+' '+ey+', '+ex+' '+ey}
      d+='<path d="'+path+'"/>'});
    var W2=portrait?560:580,H2=portrait?600:680;$('mzWires').setAttribute('viewBox','0 0 '+W2+' '+H2);$('mzWires').innerHTML=d;
  }
  function applyLang(l){
    LANG=l;AR=l==='ar';S=STRS[l];section.setAttribute('data-lang',l);stage.classList.toggle('mz-ar',AR);

    $('mzFeats').innerHTML=S.feats.map(function(f){return '<div class="mz-feat"><i>'+I[f[0]]+'</i><span>'+f[1]+'</span></div>'}).join('');
    $('dzStore').textContent=S.store;$('mzTentNm').textContent=S.tentNm;$('mzTentSub').textContent=S.tentSub;
    $('dzL1').textContent=S.dz[0];$('dzL2').textContent=S.dz[1];$('dzL3').textContent=S.dz[2];$('dzLive').textContent=S.dz[3];$('dzInc').textContent=S.dz[4];

    $('wzItems').innerHTML=S.wzItems.map(function(x){return '<div class="wz-it"><span class="c">'+I.check+'</span><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'}).join('');

    ND.forEach(function(n,i){var x=S.nodes[i];n.style.setProperty('--c',x[3]);n.querySelector('i').innerHTML=I[x[2]];n.querySelector('b').textContent=x[0];n.querySelector('small').textContent=x[1]});
    var bts=$('mzLang').querySelectorAll('button');for(var k=0;k<bts.length;k++)bts[k].classList.toggle('on',bts[k].getAttribute('data-l')===l);

  var cur=0;
  function setLine(i,dur){var ls=$('mzLines').children,ds=$('mzDots').children;cur=i;

  // ---- timeline ----
  var list=$('dzList'),bell=0,orders=42,books=9,rev=3120;

  function addRow(o,color,tag,isBooking,amount){

    list.insertBefore(row,list.firstChild);while(list.children.length>3)list.removeChild(list.lastChild);
    bell++;var b=$('dzBell');b.textContent=bell;b.classList.add('bump');setTimeout(function(){b.classList.remove('bump')},300);
    if(isBooking){books++;$('dzBook').textContent=books}else{orders++;$('dzOrders').textContent=orders;if(amount){rev+=amount;$('dzRev').textContent=fmt(rev)}}
  }
  var timers=[];function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function resetAll(){
    timers.forEach(clearTimeout);timers=[];
    stage.classList.remove('mz-s-setup','mz-s-int');

  }
  function run(){
    resetAll();
    // Scene A — customers scan the QR (0–6.4s)
    setLine(0,6400);
    layout();
    [0,1,2].forEach(function(i){var t0=300+i*2000;
      at(t0,function(){PH[i].classList.add('scan')});

    at(tStart,function(){var t0=performance.now();(function tick(){var p=Math.min(1,(performance.now()-t0)/(tEnd-tStart));var s=Math.round(p*target);$('wzTimer').textContent='0'+Math.floor(s/60)+':'+('0'+s%60).slice(-2);$('wzBar').style.width=(p*100)+'%';if(p<1&&stage.classList.contains('mz-s-setup'))requestAnimationFrame(tick)})()});

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  else{var started=false;function start(){if(started)return;started=true;run()}
    function check(){var r=wrap.getBoundingClientRect();if(r.bottom>0&&r.top<window.innerHeight)start()}

})();
