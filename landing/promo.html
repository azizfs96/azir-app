<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>easy app promo</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff;font-family:Bricolage Grotesque,sans-serif}.container{max-width:1160px;margin:0 auto;padding:0 20px}</style></head><body><!-- ======= PROMO CLIP: one scan → any business ======= -->
<section class="promo-section" id="promo" data-lang="en">
<style>
.promo-section{padding:48px 0 64px;background:var(--white,#fff)}
.promo-section.embedded{padding:0}.promo-section.embedded .pz-head,.promo-section.embedded .pz-lang{display:none}
.promo-section .pz-head{text-align:center;margin:0 auto 26px;max-width:720px}
.promo-section .pz-head .pz-logo{max-width:none}
.pz-logo-row{max-width:1100px;margin:0 auto}
.pz-logo{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin:0 0 22px;direction:ltr;max-width:1100px;margin-left:auto;margin-right:auto}
.promo-section[data-lang="ar"] .pz-logo{justify-content:flex-end}
.pz-logo img{width:96px;height:auto;display:block}
.pz-logo span{font:600 28px/1 'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif;color:#0f0f1a;letter-spacing:-.5px}
.promo-section .pz-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:600;color:var(--text-dark,#0f0f1a);letter-spacing:-.8px;margin:0 0 10px}
.promo-section .pz-head p{font-size:16px;color:var(--text-muted,#6b6b7b);margin:0;line-height:1.7}
.pz-wrap{position:relative;width:100%;max-width:1100px;margin:0 auto;overflow:hidden;border-radius:28px;background:#050506;box-shadow:0 30px 90px rgba(0,0,0,.28)}
.pz-stage{position:absolute;top:0;left:0;width:1100px;height:680px;transform-origin:0 0;background:#050506;color:#fff;font-family:'Bricolage Grotesque','IBM Plex Sans Arabic',sans-serif;overflow:hidden;--brand:#fff}
.pz-stage.pz-portrait{width:560px;height:960px}
.pz-glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 60%);opacity:.22;top:-200px;right:-240px;filter:blur(30px);transition:background 1s,opacity 1s}
.pz-portrait .pz-glow{top:auto;bottom:-300px;right:50%;margin-right:-450px}
.pz-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 68% 50%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 68% 50%,#000 10%,transparent 70%)}
.pz-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.25;animation:pzTw 4s ease-in-out infinite}
@keyframes pzTw{50%{opacity:.6;transform:scale(1.4)}}
/* ---- copy ---- */
.pz-copy{box-sizing:border-box;position:absolute;left:72px;top:0;height:100%;width:420px;display:flex;flex-direction:column;justify-content:center;gap:18px;z-index:5}
.pz-portrait .pz-copy{left:0;top:44px;width:100%;height:auto;align-items:center;text-align:center;padding:0 32px}
.pz-brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:#fff}
.pz-brand img{width:34px;height:34px;border-radius:9px}
.pz-copy h3{font-size:50px;line-height:1.04;font-weight:600;letter-spacing:-1.6px;margin:0;color:#fff}
.pz-copy h3 b{font-weight:600;color:var(--brand);transition:color .8s}
.pz-portrait .pz-copy h3{font-size:36px}
.pz-lines{position:relative;height:86px;width:100%}
.pz-portrait .pz-lines{height:76px}
.pz-line{position:absolute;inset:0;opacity:0;transform:translateY(12px);transition:opacity .22s ease,transform .22s ease;display:flex;flex-direction:column;gap:6px}
.pz-portrait .pz-line{align-items:center}
.pz-line.on{opacity:1;transform:none;transition-duration:.5s;transition-delay:.1s}
.pz-line .tag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--brand);transition:color .8s}
.pz-line .tag svg{width:16px;height:16px}
.pz-line p{font-size:18px;line-height:1.45;color:rgba(255,255,255,.72);margin:0}
.pz-portrait .pz-line p{font-size:15.5px}
.pz-dots{display:flex;gap:8px;margin-top:4px}
.pz-dot{height:5px;width:28px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.pz-dot i{position:absolute;inset:0;background:var(--brand);transform:scaleX(0);transform-origin:left}
.pz-dot.done i{transform:scaleX(1)}
.pz-dot.run i{animation:pzFill var(--d,3s) linear forwards}
@keyframes pzFill{to{transform:scaleX(1)}}
.pz-feats{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.pz-portrait .pz-feats{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 18px}
.pz-feat{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,.82)}
.pz-feat i{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.pz-feat i svg{width:14px;height:14px}
.pz-portrait .pz-feat{font-size:13px}
/* Arabic: mirrored layout (copy right, phone left) */
.pz-ar{direction:rtl}
.pz-ar .pz-copy{left:auto;right:72px;text-align:right}
.pz-ar.pz-portrait .pz-copy{right:0;text-align:center}
.pz-ar .pz-copy h3,.pz-ar .pz-line p,.pz-ar .pz-feat,.pz-ar .pz-line .tag,.pz-ar .pz-brand{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
.pz-ar .pz-copy h3{font-size:46px;line-height:1.25}
.pz-ar.pz-portrait .pz-copy h3{font-size:34px}
.pz-ar .pz-line .tag{text-transform:none;font-size:13px}
.pz-ar .pz-dot i{transform-origin:right}
.pz-ar .pz-scene{right:auto;left:120px}
.pz-ar.pz-portrait .pz-scene{left:50%;right:auto;margin:0 0 0 -150px}
.pz-ar .pz-float{transform:rotateY(22deg) rotateX(6deg) rotateZ(2deg)}
@keyframes pzFloatAr{0%,100%{transform:translateY(0) rotateY(26deg) rotateX(7deg) rotateZ(3deg)}50%{transform:translateY(-12px) rotateY(19deg) rotateX(4deg) rotateZ(2deg)}}
.pz-ar .pz-s-biz .pz-phone{transform:rotateY(-10deg) rotateX(-2deg) rotateZ(-1deg)}
.pz-ar .pz-glow{right:auto;left:-240px}
.pz-ar .pz-grid{mask-image:radial-gradient(circle at 32% 50%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 32% 50%,#000 10%,transparent 70%)}
.pz-ar .pz-glare{animation-name:pzGlareAr}
@keyframes pzGlareAr{0%,20%{transform:translateX(120%)}60%,100%{transform:translateX(-120%)}}
.promo-section[data-lang="ar"] .pz-head{direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif}
.promo-section[data-lang="ar"] .pz-head h2{letter-spacing:0}
/* ---- language toggle ---- */
.pz-lang{position:absolute;top:22px;right:28px;z-index:9;display:flex;gap:2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.pz-lang button{appearance:none;border:0;background:transparent;color:rgba(255,255,255,.65);font:600 12px/1 'IBM Plex Sans Arabic','Bricolage Grotesque',sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.pz-lang button.on{background:#fff;color:#111}
.pz-ar .pz-lang{right:auto;left:28px}
.pz-portrait .pz-lang{top:16px;right:16px}.pz-ar.pz-portrait .pz-lang{right:auto;left:16px}
/* ---- 3D scene ---- */
.pz-scene{position:absolute;right:120px;top:50%;width:300px;height:620px;margin-top:-310px;perspective:1500px;perspective-origin:40% 45%;z-index:2}
.pz-portrait .pz-scene{right:50%;top:auto;bottom:-70px;margin:0 -150px 0 0;transform:scale(.84);transform-origin:50% 100%;perspective-origin:50% 40%}
.pz-float{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(-22deg) rotateX(6deg) rotateZ(-2deg)}
@keyframes pzFloat{0%,100%{transform:translateY(0) rotateY(-26deg) rotateX(7deg) rotateZ(-3deg)}50%{transform:translateY(-12px) rotateY(-19deg) rotateX(4deg) rotateZ(-2deg)}}
.pz-phone{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.pz-s-biz .pz-phone{transform:rotateY(10deg) rotateX(-2deg) rotateZ(1deg)}
/* thickness: stacked back plates */
.pz-back{position:absolute;inset:0;border-radius:48px;background:#101013;transform:translateZ(-14px);box-shadow:0 60px 90px rgba(0,0,0,.75)}
.pz-side{position:absolute;inset:0;border-radius:48px;background:linear-gradient(160deg,#4a4a50,#1b1b1f 35%,#2d2d33 70%,#55555c)}
.pz-side.s1{transform:translateZ(-12px)}.pz-side.s2{transform:translateZ(-9px)}.pz-side.s3{transform:translateZ(-6px)}.pz-side.s4{transform:translateZ(-3px)}
.pz-body{position:absolute;inset:0;border-radius:48px;background:linear-gradient(150deg,#2a2a2e,#0b0b0d 45%,#1c1c20);padding:10px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),inset 0 0 0 4px #050506;transform:translateZ(0)}
.pz-btn{position:absolute;width:3px;border-radius:2px;background:linear-gradient(#5a5a62,#2a2a2f);transform:translateZ(-6px)}
.pz-btn.l1{left:-3px;top:120px;height:30px}.pz-btn.l2{left:-3px;top:168px;height:54px}.pz-btn.l3{left:-3px;top:232px;height:54px}.pz-btn.r1{right:-3px;top:190px;height:84px}
.pz-screen{position:relative;width:100%;height:100%;border-radius:39px;overflow:hidden;background:#0a0a0b;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif;color:#1F1A16;font-size:11px}
.pz-glare{position:absolute;inset:0;border-radius:39px;pointer-events:none;z-index:50;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.13) 46%,rgba(255,255,255,.04) 52%,transparent 60%);transform:translateX(-120%);animation:pzGlare 7s ease-in-out infinite}
@keyframes pzGlare{0%,20%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.pz-notch{position:absolute;top:9px;left:50%;width:90px;height:25px;margin-left:-45px;border-radius:20px;background:#050506;z-index:30}
.pz-notch:after{content:'';position:absolute;right:10px;top:8px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2d3a4a,#0a0e14 60%)}
.pz-status{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;padding:0 26px;font:600 11px/1 -apple-system,'Bricolage Grotesque',sans-serif;z-index:29;direction:ltr;color:#fff}
.pz-ground{position:absolute;left:-40px;right:-40px;bottom:-70px;height:60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.9),transparent 70%);filter:blur(12px);transform:translateZ(-40px)}
.pz-view{position:absolute;inset:0}
/* scanner */
.pz-cam{background:#111}
.pz-cam .bg{position:absolute;inset:-20px;background:radial-gradient(70% 50% at 50% 30%,#3a342c 0%,#17161a 60%,#0b0b0d 100%)}
.pz-cam .bokeh{position:absolute;border-radius:50%;filter:blur(14px);opacity:.5;background:var(--brand);transition:background 1s}
.pz-cam .bokeh.b1{width:90px;height:90px;left:-20px;top:120px}.pz-cam .bokeh.b2{width:60px;height:60px;right:-10px;top:360px;opacity:.3}
.pz-cam-title{position:absolute;top:60px;width:100%;text-align:center;color:#fff;font-size:13px;font-weight:600}
.pz-cam-hint{position:absolute;bottom:110px;width:100%;text-align:center;color:rgba(255,255,255,.6);font-size:10.5px;transition:opacity .3s}
.pz-locked .pz-cam-hint{opacity:0}
.pz-tent{position:absolute;left:50%;top:50%;width:156px;margin-left:-78px;transform:translateY(-50%) scale(.6);opacity:0;border-radius:12px;background:#fff;box-shadow:0 24px 44px rgba(0,0,0,.55);overflow:hidden;text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.pz-tent.on{transform:translateY(-50%) scale(1);opacity:1}
.pz-tent .hd{height:34px;background:var(--brand);display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:11px;font-weight:600;transition:background .6s}
.pz-tent .hd svg{width:16px;height:16px}
.pz-tent svg.qr{width:100px;height:100px;display:block;margin:12px auto 6px}
.pz-tent small{display:block;font-size:9px;color:#7A7068;padding-bottom:10px}
.pz-frame{position:absolute;width:210px;height:210px;left:50%;top:50%;margin:-105px 0 0 -105px}
.pz-frame b{position:absolute;width:30px;height:30px;border:3px solid rgba(255,255,255,.9);transition:border-color .3s}
.pz-frame b:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.pz-frame b:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.pz-frame b:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.pz-frame b:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.pz-laser{position:absolute;left:10px;right:10px;height:2px;top:10px;background:linear-gradient(90deg,transparent,var(--brand),transparent);box-shadow:0 0 14px var(--brand);animation:pzLaser 1.3s ease-in-out infinite}
@keyframes pzLaser{0%{top:10px}50%{top:196px}100%{top:10px}}
.pz-locked .pz-frame b{border-color:var(--brand)}
.pz-locked .pz-laser{animation:none;opacity:0}
.pz-lock{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.4,1),background .6s;z-index:3}
.pz-locked .pz-lock{transform:scale(1)}
/* business landing (revealed from the lock point) */
.pz-biz{background:#F6F4F1;clip-path:circle(0 at 50% 50%);transition:clip-path .7s cubic-bezier(.2,.8,.2,1);z-index:4;overflow:hidden}
.pz-biz.on{clip-path:circle(140% at 50% 50%)}
.bz-cover{height:172px;position:relative;background:var(--brand);background-size:cover;background-position:center;overflow:hidden;transition:background-color .6s}
.bz-cover:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,0) 45%,rgba(0,0,0,.5))}
.bz-cover .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;z-index:1}
.bz-cover .art svg{width:110px;height:110px;filter:drop-shadow(0 16px 24px rgba(0,0,0,.35))}
.bz-cover .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.bz-topbar{position:absolute;top:44px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.bz-topbar i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff}
.bz-topbar i svg{width:15px;height:15px}
.bz-card{margin:-36px 14px 0;background:#fff;border:1px solid #ECE6DF;border-radius:18px;padding:11px 12px;position:relative;z-index:2;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.08)}
.bz-logo{width:46px;height:46px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;overflow:hidden;transition:background .6s}
.bz-logo svg{width:24px;height:24px}.bz-logo img{width:46px;height:46px}
.bz-card .t{flex:1;min-width:0}
.bz-card .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz-card .s{font-size:9.5px;color:#7A7068;margin-top:3px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.bz-card .s b{color:#2E9A5E;font-weight:600}
.bz-card .s i{width:3px;height:3px;border-radius:50%;background:#ABA29A;display:inline-block;flex:none}
.bz-body{padding:10px 14px 0}
.bz-modes{display:flex;gap:6px;margin-bottom:10px}
.bz-mode{flex:1;text-align:center;padding:7px 0;border-radius:12px;background:#fff;border:1px solid #ECE6DF;font-size:9.5px;color:#7A7068}
.bz-mode.on{background:#1F1A16;color:#fff;border-color:#1F1A16}
.bz-sec{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;margin:2px 0 8px}
.bz-sec span{font-size:9px;color:var(--brand);font-weight:600}
.bz-h{display:flex;gap:8px;overflow:hidden}
.bz-dish{flex:none;width:98px;background:#fff;border:1px solid #ECE6DF;border-radius:14px;padding:5px 5px 7px;text-align:center}
.bz-dish .im{aspect-ratio:1;border-radius:10px;background:#F1EDE8;background-size:cover;background-position:center;position:relative}
.bz-dish .im b{position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:50%;background:#1F1A16;color:#fff;font-size:14px;line-height:20px;font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.bz-dish .im em{position:absolute;left:5px;top:5px;font-style:normal;font-size:7.5px;background:var(--brand);color:#fff;padding:2px 6px;border-radius:999px;font-weight:600}
.bz-dish .nm{font-size:9.5px;font-weight:600;margin:5px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz-dish .pr{font-size:9.5px;direction:ltr}.bz-dish .pr b{font-size:7.5px;color:#7A7068;font-weight:600;margin-right:2px}
.bz-info{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--brand) 9%,#fff);border:1px solid color-mix(in srgb,var(--brand) 22%,#fff);border-radius:12px;padding:8px 10px;font-size:9.5px;margin-bottom:10px;color:#1F1A16}
.bz-info i{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bz-info i svg{width:12px;height:12px}
.bz-info b{font-weight:600}
.bz-pkg{background:#fff;border:1px solid #ECE6DF;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:10px}
.bz-pkg.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand) inset}
.bz-pkg .r{width:16px;height:16px;border-radius:50%;border:1.5px solid #D9D2CA;flex:none;position:relative}
.bz-pkg.on .r{border-color:var(--brand)}.bz-pkg.on .r:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.bz-pkg .t{flex:1;min-width:0}.bz-pkg .t b{font-weight:600;display:block}.bz-pkg .t small{color:#7A7068;font-size:8.5px}
.bz-pkg .p{font-weight:600;direction:ltr}.bz-pkg .p b{font-size:7.5px;color:#7A7068;margin-right:2px}
.bz-chips{display:flex;gap:6px;margin-bottom:10px;overflow:hidden}
.bz-chip{padding:5px 10px;border-radius:999px;border:1px solid #ECE6DF;background:#fff;font-size:9.5px;color:#7A7068;white-space:nowrap}
.bz-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bz-people{display:flex;gap:8px;margin-bottom:10px}
.bz-person{flex:1;background:#fff;border:1px solid #ECE6DF;border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.bz-person.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand) inset}
.bz-av{width:34px;height:34px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 65%,#fff),var(--brand))}
.bz-person b{display:block;font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bz-person small{font-size:8px;color:#7A7068;white-space:nowrap}
.bz-days{display:flex;gap:5px;margin-bottom:8px}
.bz-day{flex:1;text-align:center;padding:5px 0;border-radius:10px;background:#fff;border:1px solid #ECE6DF;font-size:8px;color:#7A7068}
.bz-day b{display:block;font-size:11px;color:#1F1A16;font-weight:600}
.bz-day.on{background:#1F1A16;border-color:#1F1A16;color:rgba(255,255,255,.7)}.bz-day.on b{color:#fff}
.bz-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bz-slot{text-align:center;padding:7px 0;border-radius:10px;background:#fff;border:1px solid #ECE6DF;font-size:9px;direction:ltr}
.bz-slot.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bz-slot.x{color:#C9C2BA;text-decoration:line-through}
.bz-nav{position:absolute;left:14px;right:14px;bottom:14px;height:46px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid #ECE6DF;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.bz-nav i{width:30px;height:30px;border-radius:50%;background:#F1EDE8;display:flex;align-items:center;justify-content:center;color:#7A7068;font-style:normal}
.bz-nav i svg{width:14px;height:14px}
.bz-nav i.on{background:#1F1A16;color:#fff;width:78px;border-radius:999px;font-size:9.5px;gap:5px}
.pz-biz .cta{position:absolute;left:14px;right:14px;bottom:70px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;box-shadow:0 12px 26px rgba(0,0,0,.2);transition:background .6s,transform .2s;transform:translateY(130px);z-index:3}
.pz-biz.on .cta{transform:none;transition:transform .5s cubic-bezier(.2,.8,.2,1) .35s,background .6s}
.pz-biz .cta.press{transform:scale(.97)}
.pz-biz .cta svg{width:16px;height:16px}
/* orbiting QR cards */
#pzCards{position:absolute;left:0;top:0;width:100%;height:100%;direction:ltr}
.pz-card{position:absolute;left:0;top:0;width:118px;border-radius:12px;background:#fff;color:#1F1A16;overflow:hidden;box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1),opacity .35s;animation:pzBob 6s ease-in-out infinite;text-align:center;direction:rtl;font-family:'IBM Plex Sans Arabic',sans-serif}
@keyframes pzBob{50%{margin-top:-10px}}
.pz-card .hd{height:28px;background:var(--c);display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:10px;font-weight:600}
.pz-card .hd svg{width:14px;height:14px}
.pz-card svg.qr{width:74px;height:74px;display:block;margin:9px auto 4px}
.pz-card small{display:block;font-size:8px;color:#7A7068;padding-bottom:8px}
.pz-card.fly{transform:translate3d(var(--fx),var(--fy),80px) scale(.75) !important;opacity:0;transition:transform .75s cubic-bezier(.4,0,.2,1),opacity .25s .5s}
.pz-card.dim{opacity:.35}
@media (prefers-reduced-motion:reduce){.pz-laser,.pz-float,.pz-glare,.pz-card,.pz-stars i{animation:none}}
</style>

  var POS=[[-125,30,30],[-135,300,-50],[300,20,-30],[305,280,40],[-115,500,20]];
  var lines=$('pzLines'),dots=$('pzDots'),cards=$('pzCards');
  BIZ.forEach(function(b,i){
    b.word0=b.word;b.tag0=b.tag;b.sub0=b.sub;
    var l=document.createElement('div');l.className='pz-line';l.innerHTML='<span class="tag">'+ICONS[b.icon]+b.tag+'</span><p>'+b.sub+'</p>';lines.appendChild(l);
    var d=document.createElement('div');d.className='pz-dot';d.innerHTML='<i></i>';dots.appendChild(d);
    var c=document.createElement('div');c.className='pz-card';c.style.setProperty('--c',b.color);c.style.animationDelay=(i*-1.3)+'s';
    c.innerHTML='<div class="hd">'+ICONS[b.icon]+b.name+'</div>'+document.querySelector('#pzTent svg.qr').outerHTML+'<small>'+b.cat+'</small>';cards.appendChild(c);
  });
  var lineEls=lines.children,dotEls=dots.children,cardEls=cards.children;
  function applyLang(l){
    LANG=l;AR=l==='ar';var STR=STRS[l];
    section.setAttribute('data-lang',l);stage.classList.toggle('pz-ar',AR);
    $('pzHeadT').textContent=STR.headT;$('pzHeadP').textContent=STR.headP;$('pzH3').innerHTML=STR.h3;
    $('pzFeats').innerHTML=STR.feats.map(function(f){return '<div class="pz-feat"><i>'+ICONS[f[0]]+'</i><span>'+f[1]+'</span></div>'}).join('');
    BIZ.forEach(function(b,i){b.word=STR.words?STR.words[i]:b.word0;b.tag=STR.tags?STR.tags[i]:b.tag0;b.sub=STR.subs?STR.subs[i]:b.sub0;
      lineEls[i].innerHTML='<span class="tag">'+ICONS[b.icon]+b.tag+'</span><p>'+b.sub+'</p>';});
    var bts=$('pzLang').querySelectorAll('button');for(var k=0;k<bts.length;k++)bts[k].classList.toggle('on',bts[k].getAttribute('data-l')===l);
    fit();$('pzWord').textContent=BIZ[idx].word;for(var k2=0;k2<lineEls.length;k2++)lineEls[k2].classList.toggle('on',k2===idx);
  }
  $('pzLang').addEventListener('click',function(e){var b=e.target.closest('button');if(b)applyLang(b.getAttribute('data-l'))});
  window.pzSetLang=applyLang;
  var cam=$('pzCam'),biz=$('pzBiz'),tent=$('pzTent');

  function fit(){
    var w=wrap.clientWidth,portrait=w<760;
    stage.classList.toggle('pz-portrait',portrait);
    var W=portrait?560:1100,H=portrait?960:680,s=w/W;
    stage.style.transform='scale('+s+')';wrap.style.height=(H*s)+'px';
    var P=portrait?[[-150,80,30],[-130,340,-50],[300,60,-30],[320,320,40],[95,-128,20,.82]]:POS;
    for(var i=0;i<cardEls.length;i++){var p=P[i],x=AR?(300-118-p[0]+(portrait?0:14)):p[0];cardEls[i].style.transform='translate3d('+x+'px,'+p[1]+'px,'+p[2]+'px) rotateY('+(x<0?18:-18)+'deg) scale('+(p[3]||1)+')';
      cardEls[i].style.setProperty('--fx',(150-59)+'px');cardEls[i].style.setProperty('--fy',(310-70)+'px');}
  }
  var idx=0;
  fit();window.addEventListener('resize',fit);
  applyLang(LANG);

  function show(i){
    var b=BIZ[i];
    stage.style.setProperty('--brand',b.color);
    $('pzWord').textContent=b.word;
    for(var k=0;k<lineEls.length;k++){lineEls[k].classList.toggle('on',k===i);
      dotEls[k].className='pz-dot'+(k<i?' done':k===i?' run':'');dotEls[k].style.setProperty('--d','3600ms');
      if(k===i){var el=dotEls[k].firstElementChild;el.style.animation='none';void el.offsetWidth;el.style.animation=''}
      cardEls[k].classList.toggle('dim',k!==i);}
    $('pzTentIc').innerHTML=ICONS[b.icon];$('pzTentNm').textContent=b.name;
    biz.innerHTML=TPL[b.tpl](b);
  }
  var timers=[];function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function step(){
    timers.forEach(clearTimeout);timers=[];
    var card=cardEls[idx];
    show(idx);
    stage.classList.remove('pz-locked','pz-s-biz');biz.classList.remove('on');tent.classList.remove('on');
    at(250,function(){card.classList.add('fly')});
    at(800,function(){tent.classList.add('on')});
    at(1500,function(){stage.classList.add('pz-locked')});
    at(1950,function(){stage.classList.add('pz-s-biz');biz.classList.add('on')});
    at(3300,function(){var c=biz.querySelector('.cta');c.classList.add('press');setTimeout(function(){c.classList.remove('press')},220)});
    at(3900,function(){card.classList.remove('fly');idx=(idx+1)%BIZ.length;step()});
  }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){show(0);stage.classList.add('pz-locked','pz-s-biz');biz.classList.add('on')}
  else{
    var started=false;function start(){if(started)return;started=true;step()}
    function visible(){var r=wrap.getBoundingClientRect();return r.bottom>0&&r.top<window.innerHeight}
    function check(){if(visible())start()}
    check();window.addEventListener('scroll',check,{passive:true});window.addEventListener('resize',check);setTimeout(check,800);
    if('IntersectionObserver' in window){new IntersectionObserver(function(e){if(e[0].isIntersecting)start()},{threshold:.15}).observe(wrap)}
  }
})();
